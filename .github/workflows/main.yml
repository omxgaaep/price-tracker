name: Check prices

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check prices
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python tracker.py

      - name: Save price history
        if: always()
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "price-tracker-bot@users.noreply.github.com"
          git add data/state.json || true
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%F_%H%M)"
          git push || (git pull --rebase && git push)
